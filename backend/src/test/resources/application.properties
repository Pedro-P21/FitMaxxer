app.jwt.secret=test-only-secret-for-fitmaxxer-tests-that-is-at-least-32-bytes
spring.cache.cache-names=foodSearchCache,foodDetailsCache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h
openfoodfacts.base-url=https://world.openfoodfacts.net
openfoodfacts.staging=true
openfoodfacts.staging-username=off
openfoodfacts.staging-password=off
openfoodfacts.user-agent=FitMaxxerTest/1.0 (test@example.com)
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=2000
spring.jpa.hibernate.ddl-auto=create-drop
