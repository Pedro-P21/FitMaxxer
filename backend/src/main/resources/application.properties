spring.application.name=backend

# H2 DB configuration
spring.datasource.url=jdbc:h2:file:./data/fitmaxxerdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-lifetime=PT15M


openfoodfacts.base-url=${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.net}
openfoodfacts.staging=${OPENFOODFACTS_STAGING:true}
openfoodfacts.staging-username=${OPENFOODFACTS_STAGING_USERNAME:off}
openfoodfacts.staging-password=${OPENFOODFACTS_STAGING_PASSWORD:off}
openfoodfacts.user-agent=${OPENFOODFACTS_USER_AGENT:FitMaxxer/1.0 (p.pachecodev@gmail.com)}

# Backend cache for normalized food searches.
spring.cache.cache-names=foodSearchCache,foodDetailsCache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h
daily-log.history.max-lookback-years=10
