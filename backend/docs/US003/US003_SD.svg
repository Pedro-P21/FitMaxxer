atalogResponseDTO</title><rect fill="#FFFFFF" height="29.3105" style="stroke:#181818;stroke-width:1;" width="10" x="4033.2871" y="1393.9707"/></g><path d="M1241,96.4883 L1241,151.4883 L2015,151.4883 L2015,106.4883 L2005,96.4883 L1241,96.4883" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2005,96.4883 L2005,106.4883 L2015,106.4883 L2005,96.4883" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.4697" x="1388.8279" y="114.0566">Backend @Cacheable foodSearchCache uses a normalized query key</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.8408" x="1388.8279" y="129.3672">(lowercase + trim; configured maximumSize=500, expireAfterWrite=24h).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.397" x="1388.8279" y="144.6777">A hit returns cached domain results. A miss invokes the adapters.</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="402.3838,174.7305,412.3838,178.7305,402.3838,182.7305,406.3838,178.7305" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.1826" x2="408.3838" y1="178.7305" y2="178.7305"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="60.1826" y="173.9883">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.8921" x="72.7583" y="173.9883">enters keyword or barcode</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#181818" points="719.5239,219.3516,729.5239,223.3516,719.5239,227.3516,723.5239,223.3516" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="424.3838" x2="725.5239" y1="223.3516" y2="223.3516"