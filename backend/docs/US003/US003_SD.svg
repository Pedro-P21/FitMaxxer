 class="message" data-entity-1="part7" data-entity-2="part6" id="msg12"><polygon fill="#181818" points="1658.8784,593.0332,1648.8784,597.0332,1658.8784,601.0332,1654.8784,597.0332" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="1652.8784" x2="1920.1772" y1="597.0332" y2="597.0332"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="1664.8784" y="592.291">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.7476" x="1686.0298" y="592.291">raw JSON payload</text></g><path d="M1652,610.0332 L1652,788.0332 L2021,788.0332 L2021,620.0332 L2011,610.0332 L1652,610.0332" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M2011,610.0332 L2011,620.0332 L2021,620.0332 L2011,610.0332" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7979" x="1658" y="627.6016">Parsing / normalization boundary:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.1738" x="1658" y="642.9121">1. Jackson reads raw JSON into provider DTOs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.3701" x="1670.3398" y="658.2227">(products, code, product_name, nutriments,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.9214" x="1670.3398" y="673.5332">serving_size, and units).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.7681" x="1658" y="688.8438">2. FoodItemMapper selects usable fields and converts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.1465" x="1670.3398" y="704.1543">provider naming/units to the internal representation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.0166" x="1658" y="719.4648">3. FoodItemFactory validates and creates FoodId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.9141" x="1670.3398" y="734.7754">FoodName, optional Barcode, NutrientComposition,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.731" x="1670.3398" y="750.0859">ServingSize, then the FoodItem entity root.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.8481" x="1658" y="765.3965">Invalid or incomplete products are skipped/reported;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.2407" x="1658" y="780.707">third-party DTOs do not enter the domain model.</text><g class="message" data-entity-1="part6" data-entity-2="part9" id="msg13"><polygon fill="#181818" points="2343.6675,810.7598,2353.6675,814.7598,2343.6675,818.7598,2347.6675,814.7598" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="1647.8784" x2="2349.6675" y1="814.7598" y2="814.7598"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="1654.8784" y="810.0176">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.3228" x="1676.0298" y="810.0176">readValue(rawJson, OpenFoodFactsSearchResponseDTO)</text></g><g class="message" data-entity-1="part9" data-entity-2="part10" id="msg14"><polygon fill="#181818" points="2644.4116,840.0703,2654.4116,844.0703,2644.4116,848.0703,2648.4116,844.0703" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="2365.6675" x2="2650.4116" y1="844.0703" y2="844.0703"/><text fill="#000000" font-family="sans-serif" fo