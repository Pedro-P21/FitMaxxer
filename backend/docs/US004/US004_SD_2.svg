x2="337.6426" y1="1696.7695" y2="1696.7695"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="40.1826" y="1692.0273">69</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.3086" x="61.334" y="1692.0273">displays added food and updated progress</text></g><path d="M2756,1709.7695 L2756,1826.7695 L3246,1826.7695 L3246,1719.7695 L3236,1709.7695 L2756,1709.7695" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3236,1709.7695 L3236,1719.7695 L3246,1719.7695 L3236,1709.7695" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5415" x="2762" y="1727.3379">DDD boundary: DailyLog owns Meal and MealItem entities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.4282" x="2762" y="1742.6484">Each MealItem owns FoodSnapshot and PortionQuantity value objects. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.9023" x="2762" y="1757.959">log does not store FoodItem, FoodId, or the temporary catalog DTO. An</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.9004" x="2762" y="1773.2695">optional barcode is copied into FoodSnapshot as descriptive metadata.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.3047" x="2762" y="1788.5801">DailyLog stores the profile ID and immutable goal snapshot, not the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.436" x="2762" y="1803.8906">UserNutritionalProfile aggregate object. US004 only adds items; edits</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.1499" x="2762" y="1819.2012">and removals are handled by US009.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="4616.1045" x="0" y="1852.5986"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4616.1045" y1="1852.5986" y2="1852.5986"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4616.1045" y1="1855.5986" y2="1855.5986"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="225.8213" x="2195.1416" y="1841.9434"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.5366" x="2201.1416" y="1858.5117">Validation and failure behavior</text><path d="M567,1880.2539 L567,1966.2539 L2619,1966.2539 L2619,1890.2539 L2609,1880.2539 L567,1880.2539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2609,1880.2539 L2609,1890.2539 L2619,1890.2539 L2609,1880.2539" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="435.2524" x="1360.5984" y="1897.8223">Authentication failures stop before the controller. Invalid meal types,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.5488" x="1360.5984" y="1913.1328">non-positive serving quantities, missing catalog data, or incompatible</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.8379" x="1360.5984" y="1928.4434">nutrient bases return a clear client error and do not persist a partial log.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.8242" x="1360.5984" y="1943.7539">Repository failures return a service error; transaction rollback prevents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4302" x="1360.5984" y="1959.0645">a newly created log without its first 