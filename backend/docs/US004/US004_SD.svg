000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.4639" x="4458.1509" y="2375.6367">response DTO</text></g><g class="message" data-entity-1="part18" data-entity-2="part5" id="msg67"><polygon fill="#181818" points="1270.561,2405.6895,1260.561,2409.6895,1270.561,2413.6895,1266.561,2409.6895" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="1264.561" x2="4413.9995" y1="2409.6895" y2="2409.6895"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="1276.561" y="2404.9473">67</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.4639" x="1297.7124" y="2404.9473">response DTO</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg68"><polygon fill="#181818" points="1008.0361,2435,998.0361,2439,1008.0361,2443,1004.0361,2439" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="1002.0361" x2="1253.561" y1="2439" y2="2439"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="1014.0361" y="2434.2578">68</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4985" x="1035.1875" y="2434.2578">DailyLogResponseDTO</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg69"><polygon fill="#181818" points="364.6426,2464.3105,354.6426,2468.3105,364.6426,2472.3105,360.6426,2468.3105" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="358.6426" x2="991.0361" y1="2468.3105" y2="2468.3105"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="370.6426" y="2463.5684">69</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.396" x="391.7939" y="2463.5684">200 OK + updated response DTO</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg70"><polygon fill="#181818" points="34.1826,2493.6211,24.1826,2497.6211,34.1826,2501.6211,30.1826,2497.6211" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="28.1826" x2="347.6426" y1="2497.6211" y2="2497.6211"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="40.1826" y="2492.8789">70</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.3086" x="61.334" y="2492.8789">displays added food and updated progress</text></g><path d="M2510,2510.6211 L2510,2627.6211 L3325,2627.6211 L3325,2520.6211 L3315,2510.6211 L2510,2510.6211" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M3315,2510.6211 L3315,2520.6211 L3325,2520.6211 L3315,2510.6211" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5415" x="2678.5144" y="2528.1895">DDD boundary: DailyLog owns Meal and MealItem entities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.4282" x="2678.5144" y="2543.5">Each MealItem owns FoodSnapshot and PortionQuantity value objects. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.9023" x="2678.5144" y="2558.8105">log does not store FoodItem, FoodId, or the temporary catalog DTO. An</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.9004" x="2678.5144" y="2574.1211">optional barcode is copied into FoodSnapshot as descriptive metadata.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.3047" x="2678.5144" y="2589.4316">DailyLog stores the profile ID and immutable goal snapshot, not the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.436" x="2678.5144" y="2604.7422">UserNutritionalProfile aggregate object. US004 only adds items; edits</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.1499" x="2678.5144" y="2620.0527">and removals are handled by US009.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="4882.813" x="0" y="2653.4502"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4882.813" y1="2653.4502" y2="2653.4502"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4882.813" y1="2656.4502" y2="2656.4502"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="225.8213" x="2328.4958" y="2642.7949"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.5366" x="2334.4958" y="2659.3633">Validation and failure behavior</text><path d="M582,2681.1055 L582,2767.1055 L1693,2767.1055 L1693,2691.1055 L1683,2681.1055 L582,2681.1055" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1683,2681.1055 L1683,2691.1055 L1693,2691.1055 L1683,2681.1055" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="435.2524" x="905.0889" y="2698.6738">Authentication failures stop before the controller. Invalid meal types,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.5488" x="905.0889" y="2713.9844">non-positive serving quantities, missing catalog data, or incompatible</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.8379" x="905.0889" y="2729.2949">nutrient bases return a clear client error and do not persist a partial log.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.8242" x="905.0889" y="2744.6055">Repository failures return a service error; transaction rollback prevents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4302" x="905.0889" y="2759.916">a newly created log without its first valid item.</text><?plantuml-src tLbBSnit4hxpLtJvidA5b5n9Bf5ZLIccbL8UbXr9taiku0n88XeE9W262lFhjxlndE4mcztQWsilAf7e_j3l1oXwfzj-jv9cPfzKsmaZTh3JhQwsHkyaEDFBugGJrPFOo7jtQ2GOMJdHRfgIm6v5hPzLku6rQAoSpKJbj84NZrQQ5o0iNDFd6H8xLQbEj0vUt3IzSzB0TTSnoUFjyFpoXty-m7NljhB5BuLJkeKRrRY8Y2SZXgLGpU4dlNchMsTqqmJAjyuq9oZnxYPWtqkpLvLaZljzTOBX5zbfgr2N0nE6RqR4fFNxtXb5kABvOFHQDNB4MdmxOh_Hkduhd6ZqvcClpI581cUFzwzUVVMIkOc63q_pBgL3eUtouGxEdDnrsWXpoDpv-8IgD-p3f6VuE2B-MOhc5j5BukBpY9gDWkwyhqI3mJ8mkV_gX2nC4Z-S485fueS9izotehDRxU3iasXw2NUhtp2Iiq7Y-OZrWpRaneyzVbJkCCKTI2RaUZXqSeeZdfrGzsVHTI5u_RyZkkkwZeh-8d_lfNNeHYRF7qy6iErqQsLcI9zddBPgBvmC-Sf_ON65kGcNe3lPMd2w5eT_M5YZoG33BFDW0YCTKbDg8lttxnxWGdJgegQx5qXxmSo_jaIWZVgJ4-yIlfF2O27uLbILj7RXz9DihmfPADCPCsFlCLfgEcHY46qDgrurDNH6jQHq0skiP63xLMAbEe2iQssUXQcnZh6fu5dXiSXrHjRGOmBVrba2hY2r74eqOpp4nMg1i1lf7aYxCyyyXwet1Y6NoF0oGr5f8GRa2yM3H59j_TtXaHclsvfO_WrCB3mHOv7akEjyrVasUlogb3popKJZKaA1_4DPPsS0GJ8VT0ZcT14VPtMWVucK2J44A4GcP2zu46CdEjXXjDevE67GJ613fitPRvtH6uD-Bq7Bg8G1tg8KpuG3y7I5daE0A5eoqcd6e8x4BWRlzTX4S90kcwaeuICd1kyD35KMV1ZmPhccEyTGmY5Eg_4hepPR1thDqGL05XDrZ1pOQ3G-XJrWZ0Ds0gnYUoMVpvbqgGa3AYC978bGVOkwecy2RRG1qKjq65sPZH0DYXVIHPIPc5OJrqs6rpiwBcEi2FSvXGQfwZNupwFEtps8FVpdJsaqgDQ99_bvXLnRptnfoBLgecgNsKpkzbKerkWlNxs2kn_XY-5r1GkNCYhJL4kvl5z2hMpNY4EkxLYgXwavwWGM2tQrbVR2oWPxMcW6lQK1a8UKapSm8K5NVaX1A9m1iE-FB_2uv3jmr4I99z32xw4N3zlDXxlxwNvpeR1Fsb_RivMk3vSi0XNMNUZ1yuWRM_pB_xS6bO9tXIKAVhY_Umza2XOgoKctAOFOQoMRsix6uLacMfmnA8CfQOl6L0mW-TyYXMQ3Z4cqHRe4AqpEEBFZj1bsOP6vKWSrYNsw3wTPsdVnOZW-2r7wazPFVVUZF1G0UGBF_06icBnz8Oh1ZhdKOzzr6j90plav02q6y