2409.6895,364.6426,2413.6895,360.6426,2409.6895" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="358.6426" x2="991.0361" y1="2409.6895" y2="2409.6895"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="370.6426" y="2404.9473">67</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.396" x="391.7939" y="2404.9473">200 OK + updated response DTO</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg68"><polygon fill="#181818" points="34.1826,2435,24.1826,2439,34.1826,2443,30.1826,2439" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="28.1826" x2="347.6426" y1="2439" y2="2439"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1514" x="40.1826" y="2434.2578">68</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.3086" x="61.334" y="2434.2578">displays added food and updated progress</text></g><path d="M2510,2452 L2510,2569 L3325,2569 L3325,2462 L3315,2452 L2510,2452" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M3315,2452 L3315,2462 L3325,2462 L3315,2452" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5415" x="2678.5144" y="2469.5684">DDD boundary: DailyLog owns Meal and MealItem entities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="469.4282" x="2678.5144" y="2484.8789">Each MealItem owns FoodSnapshot and PortionQuantity value objects. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="451.9023" x="2678.5144" y="2500.1895">log does not store FoodItem, FoodId, or the temporary catalog DTO. An</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.9004" x="2678.5144" y="2515.5">optional barcode is copied into FoodSnapshot as descriptive metadata.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.3047" x="2678.5144" y="2530.8105">DailyLog stores the profile ID and immutable goal snapshot, not the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.436" x="2678.5144" y="2546.1211">UserNutritionalProfile aggregate object. US004 only adds items; edits</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.1499" x="2678.5144" y="2561.4316">and removals are handled by US009.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="4882.813" x="0" y="2594.8291"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4882.813" y1="2594.8291" y2="2594.8291"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="4882.813" y1="2597.8291" y2="2597.8291"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="225.8213" x="2328.4958" y="2584.1738"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.5366" x="2334.4958" y="2600.7422">Validation and failure behavior</text><path d="M582,2622.4844 L582,2708.4844 L1693,2708.4844 L1693,2632.4844 L1683,2622.4844 L582,2622.4844" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1683,2622.4844 L1683,2632.4844 L1693,2632.4844 L1683,2622.4844" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="435.2524" x="905.0889" y="2640.0527">Authentication failures stop before the controller. Invalid meal types,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.5488" x="905.0889" y="2655.3633">non-positive serving quantities, missing catalog data, or incompatible</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.8379" x="905.0889" y="2670.6738">nutrient bases return a clear client error and do not persist a partial log.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="446.8242" x="905.0889" y="2685.9844">Repository failures return a service error; transaction rollback prevents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4302" x="905.0889" y="2701.2949">a newly created log without its first valid item.</text><?plantuml-src tLbBSzj64hxpLtJvidA5b5oxkKI9LQMOrfOInt8YoRdaCWI6vAn0338peCBy-ktkUG844-zM3gvSL0BG_Ks_7qFHEztskvKqC_kasauOiOETRdMrDNedmPbU5bywKJs9ZRntXqQ2aPKJxQOf2UnMrFfPjHjOYyRAsKnKJXjuyMYbUG72mZKzpv3OgKfredNmugRfdPC6hhkEIHvlXzyll_lv0QvxjvKjlXHEwHPkLECY8duPCIo5QWxlzEQDRftHJHCetpZJdA34ivk0VI_DNbMIEUxtrGc6dsIdhK9T3amOteo8IUltlJEAS4NpmUYrQkI8jNWxOh_HkduZd6ZqviTUcaEG3CuUxr-z-jTBvYOQ_dYQToaT2csN3tTmvkIkqqQOG-REdq-eUiC-J7g6nn7n3r8qjuXU4XVF8ses2hhplX8D1il0vFxL2LcO93wS485fuiE4MUvRqTcjTd3sKJIzXBlLVp2Iiq7Yzn7h1st8ZJ_s-AZSOOexa4p8zN3ev1H7_7P2tHz4ruNWzV-EwAxhEYhwa_orbzQX6vayFvuCODlfrihCa9vddBPgBvmC-Sf_ON65kGcNe3lPMd2w5eT_M5YZoG33BFDW0YCTKbDg8ls_tpx0XUZKHKrdBv3sWfb_QOb06_Kx9zubV2k5mKBmZQWgQUt2wIVPNXMoKAOpPiRUOxJKz969GRGrh7hLrD0PrPBI3Qonae7jLucLwW2ohhLv5gR6EiQcWcU5dqMkCxA67XFujiuIS0MfvL2Y6UCXBbOBXDr8zq3QdNdcELIzCGYvH8QN6OfA2p4WNoWU999gwsyFZynutTR4yYSmiV14Z4MIuwxpLUURwF6hKlB8DnEDIma5yZTbdPq11Cbyq26OqqLydDM1_YLI9iGGe12PaBtWGOoTw627qMhdu8H1Cu4DcJPdltL6RmpwlGGjen86U8jIF1C-WAShz1m2HD6IaKup1dKaTZ5uhyScWeDqsKn52HyvCNXlOAYouCE0DyirtJc64WvnMeslZDfi7UWrHnS0MKpKCN9Wez7u5FQ0CGxO2R2AxPLyFcVIfIOCg8maS2H2zItgYhu9jD46H2_HONHaDa8qA1v81r5cObfD73SPNc_fSnbZHRZFAJH8LQ_1_nvr_kn1xE4_lqkZGRLEFCdFA-JQUkPBGwvL4rMxp6