 font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="430.0356" y="145.0225">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2305" x="442.6113" y="137.3672">GET /api/daily-log/history?month={month}&amp;year={year}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.3945" x="442.6113" y="152.6777">Authorization: Bearer &lt;access-token&gt;</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3"><line style="stroke:#181818;stroke-width:1;" x1="938.9824" x2="980.9824" y1="186.7305" y2="186.7305"/><line style="stroke:#181818;stroke-width:1;" x1="980.9824" x2="980.9824" y1="186.7305" y2="199.7305"/><line style="stroke:#181818;stroke-width:1;" x1="939.9824" x2="980.9824" y1="199.7305" y2="199.7305"/><polygon fill="#181818" points="949.9824,195.7305,939.9824,199.7305,949.9824,203.7305,945.9824,199.7305" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="945.9824" y="181.9883">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.7266" x="958.5581" y="181.9883">authenticates user and identifies owner</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg4"><line style="stroke:#181818;stroke-width:1;" x1="938.9824" x2="980.9824" y1="229.041" y2="229.041"/><line style="stroke:#181818;stroke-width:1;" x1="980.9824" x2="980.9824" y1="229.041" y2="242.041"/><line style="stroke:#181818;stroke-width:1;" x1="939.9824" x2="980.9824" y1="242.041" y2="242.041"/><polygon fill="#181818" points="949.9824,238.041,939.9824,242.041,949.9824,246.041,945.9824,242.041" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="945.9824" y="224.2988">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.6646" x="958.5581" y="224.2988">validates month/year against calendar and supported history window</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg5"><line style="stroke:#181818;stroke-width:1;" x1="938.9824" x2="980.9824" y1="271.3516" y2="271.3516"/><line style="stroke:#181818;stroke-width:1;" x1="980.9824" x2="980.9824" y1="271.3516" y2="284.3516"/><line style="stroke:#181818;stroke-width:1;" x1="939.9824" x2="980.9824" y1="284.3516" y2="284.3516"/><polygon fill="#181818" points="949.9824,280.3516,939.9824,284.3516,949.9824,288.3516,945.9824,284.3516" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="945.9824" y="266.6094">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.2173" x="958.5581" y="266.6094">derives current date and requested month range</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg6"><line style="stroke:#181818;stroke-width:1;" x1="938.9824" x2="980.9824" y1="328.9727" y2="328.9727"/><line style="stroke:#181818;stroke-width:1;" x1="980.9824" x2="980.9824" y1="328.9727" y2="341.9727"/><line style="stroke:#181818;stroke-width:1;" x1="939.9824" x2="980.9824" y1="341.9727" y2="341.9727"/><polygon fill="#181818" points="949.9824,337.9727,939.9824,341.9727,949.9824,345.9727,945.9824,341.9727" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="945.9824" y="316.5752">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6079" x="958.5581" y="308.9199">retrieves owner's saved logs in requested month</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.4165" x="958.5581" y="324.2305">(excluding today if month is current)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg7"><line style="stroke:#181818;stroke-width:1;" x1="938.9824" x2="980.9824" y1="371.2832" y2="371.2832"/><line style="stroke:#181818;stroke-width:1;" x1="980.9824" x2="980.9824" y1="371.2832" y2="384.2832"/><line style="stroke:#181818;stroke-width:1;" x1="939.9824" x2="980.9824" y1="384.2832" y2="384.2832"/><polygon fill="#181818" points="949.9824,380.2832,939.9824,384.2832,949.9824,388.2832,945.9824,384.2832" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="945.9824" y="366.541">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.4189" x="958.5581" y="366.541">calculates each log's nutrition summary from its stored snapshots</text></g><path d="M10,399.2832 L72.1387,399.2832 L72.1387,406.5938 L62.1387,416.5938 L10,416.5938 L10,399.2832" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="149.5078" style="stroke:#000000;stroke-width:1.5;" width="967.2461" x="10" y="399.2832"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="17.1387" x="25" y="412.8516">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="176.6714" x="87.1387" y="411.918">[Logs exist for selected month]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg8"><polygon fill="#181818" points="434.0356,433.9043,424.0356,437.9043,434.0356,441.9043,430.0356,437.9043" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="428.0356" x2="927.9824" y1="437.